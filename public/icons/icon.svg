<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#151b28"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Stopwatch Ring -->
  <circle cx="256" cy="270" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="12" opacity="0.95"/>
  <circle cx="256" cy="270" r="192" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.4"/>
  
  <!-- Stopwatch Top Button -->
  <rect x="236" y="58" width="40" height="28" rx="8" fill="url(#goldGrad)"/>
  <rect x="246" y="86" width="20" height="10" fill="#f59e0b"/>

  <!-- Dial Background -->
  <circle cx="256" cy="270" r="172" fill="#0e1320"/>

  <!-- Urgent Red Sector (Deadline countdown) -->
  <path d="M 256 270 L 256 120 A 150 150 0 0 1 406 270 Z" fill="url(#redGrad)" opacity="0.25"/>

  <!-- Stylized Football Base -->
  <circle cx="256" cy="270" r="95" fill="#f1f5f9"/>
  <!-- Center Gold Pentagon -->
  <polygon points="256,225 288,248 276,285 236,285 224,248" fill="url(#goldGrad)"/>
  <!-- Pentagon radiating seams -->
  <line x1="256" y1="225" x2="256" y2="175" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
  <line x1="288" y1="248" x2="336" y2="232" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
  <line x1="276" y1="285" x2="305" y2="335" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
  <line x1="236" y1="285" x2="207" y2="335" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
  <line x1="224" y1="248" x2="176" y2="232" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>

  <!-- Stopwatch Needle (Tension) -->
  <line x1="256" y1="270" x2="256" y2="140" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
  <circle cx="256" cy="270" r="8" fill="#ef4444"/>
</svg>