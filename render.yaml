services:
  - type: web
    name: deadline-panic
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20

  - type: web
    name: rondo-rush
    runtime: static
    staticPublishPath: ./public/rondo-rush
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
